name: Python repository checks

on:
  push:
  pull_request:

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall app.py scripts src tests
      - name: Repository schema check
        run: python tests/test_repository_schema.py
